name = "wcab-analytics"
main = "worker.mjs"
compatibility_date = "2026-10-28"
workers_dev = true

# Upload ONLY the admin UI; never the website root, secrets or local data.
[assets]
directory = "../admin"
binding = "ASSETS"
run_worker_first = true

[vars]
# Replace with your actual public website origin (no path, no trailing slash).
ALLOWED_ORIGINS = "https://alice314159.github.io"
# Used only by the admin page's Return to website links.
SITE_URL = "https://alice314159.github.io/Worst-Case-A-Bug/"

[[d1_databases]]
binding = "DB"
database_name = "wcab-analytics"
# Replace with the database_id returned by `wrangler d1 create` before deployment.
#database_id = "00000000-0000-0000-0000-000000000000"
database_id = "aec239c8-7fec-46ea-95f1-e0cee382e828"
[triggers]
crons = ["0 3 * * *"]

# ADMIN_TOKEN and VISITOR_SALT are secrets; never put them in this file.
